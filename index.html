<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame &amp; Light | Photography prints</title>
    <meta
      name="description"
      content="Frame &amp; Light is a demo online store for photography prints, built with React and Vite. The brand is fictional: nothing is for sale."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph: the title, text and picture that chat apps and social sites show for a shared link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frame &amp; Light" />
    <meta property="og:title" content="Frame &amp; Light | Photography prints (demo store)" />
    <meta
      property="og:description"
      content="A demo online store for photography prints: search, filters, cart, wishlist, checkout and dark mode. Built with React and Vite."
    />
    <meta property="og:url" content="https://frame-and-light-store.vercel.app/" />
    <!-- WHY an absolute URL: apps that show link previews need the full address of the image. -->
    <meta property="og:image" content="https://frame-and-light-store.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Frame &amp; Light home page: a big headline next to a framed photo of a lake pier." />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Runs before React: put the saved (or the system) theme on <html> right away.
      // WHY: without this, dark mode users would see a white flash while the app loads.
      ;(function () {
        var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        try {
          var saved = JSON.parse(localStorage.getItem('fl-theme'))
          if (saved === 'dark' || saved === 'light') theme = saved
        } catch (error) {
          // localStorage is blocked or broken: keep the system theme.
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <noscript>Frame &amp; Light is a React app. Please turn on JavaScript to see the store.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
